title = "CaptureOS gitleaks config"

# Extend the default gitleaks ruleset rather than replacing it.
[extend]
useDefault = true

[allowlist]
description = "Known-safe test/dev fixtures, not real credentials"
regexes = [
  # Hardcoded JWT signing secret used only in pytest fixtures (apps/api/tests/conftest.py).
  # Intentionally fake, never used outside CI/local test runs.
  '''test-secret-key-at-least-32-characters-long''',
]
