# gitleaks config for CaptureOS.
#
# Used by `.githooks/pre-commit` (via `gitleaks protect --staged`) and by any manual
# `gitleaks detect` run over history. Extends the upstream default ruleset — this file
# only ADDS allowlist entries, it never disables a rule.
#
# Everything allowlisted below is a NON-SECRET placeholder that must stay in the repo for
# the offline/CI path to work with no credentials. Real credentials live only in `.env`,
# which is gitignored and blocked by the hook's filename check.

[extend]
useDefault = true

# --- Rules the upstream default set does not cover ---
#
# `.githooks/pre-commit` prefers gitleaks over its own grep fallback whenever gitleaks is
# installed. The fallback greps for `sk-ant-api…`, but gitleaks' default ruleset has no
# Anthropic rule — so without the rule below, installing gitleaks would LOSE Anthropic-key
# coverage. Verified against the default set: Stripe `sk_live_` and Google `AIza…` are
# already detected; `sk-ant-` is not.

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-(?:api|admin)[0-9]{2}-[A-Za-z0-9_\-]{32,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "anthropic-api-key-loose"
description = "Anthropic API key (short/truncated form)"
regex = '''sk-ant-[A-Za-z0-9_\-]{24,}'''
keywords = ["sk-ant-"]

[allowlist]
description = "Non-secret test/CI placeholders and documentation examples"

# Deliberate, public, non-production constants.
regexes = [
  # Test JWT secret pinned in tests/conftest.py so the suite runs with no credentials.
  '''test-secret-key-at-least-32-characters-long-xx''',
  # CI JWT secret in .github/workflows/ci.yml — public by design, CI-only.
  '''ci-only-insecure-secret-key-at-least-32-characters''',
  # The shipped insecure dev default in config.py; `_guard_production_secrets` rejects it
  # in staging/production, so it can never authenticate a real deployment.
  '''dev-only-insecure-change-me-please-32chars-min''',
  # Public mock Stripe Issuing HMAC secret (config.py `_DEFAULT_ISSUING_MOCK_SECRET`);
  # also rejected at boot in prod-like envs.
  '''whsec_issuing_mock_dev_do_not_use_in_prod''',
  # Local Postgres dev credentials (docker-compose default user/password `captureos`).
  '''postgresql\+(asyncpg|psycopg)://captureos:captureos@''',
]

paths = [
  # `.env.example` documents every knob with placeholder values, never real ones.
  '''^\.env\.example$''',
  # Archived agent/codex review transcripts quote the test constants above verbatim.
  '''^\.planning/gate/.*\.md$''',
]
