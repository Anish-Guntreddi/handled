name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (lint, type, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: captureos
          POSTGRES_PASSWORD: captureos
          POSTGRES_DB: captureos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U captureos -d captureos_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CAPTUREOS_ENV: ci
      LLM_PROVIDER: mock
      EMBEDDINGS_PROVIDER: mock
      STORAGE_PROVIDER: local
      QUEUE_PROVIDER: local
      DOCPARSE_PROVIDER: local
      AUDIT_SINK: postgres
      BILLING_PROVIDER: mock
      JWT_SECRET: ci-only-insecure-secret-key-at-least-32-characters
      DATABASE_URL: postgresql+asyncpg://captureos:captureos@localhost:5432/captureos_test
      DATABASE_URL_SYNC: postgresql+psycopg://captureos:captureos@localhost:5432/captureos_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      # Only first-party actions/* are used (GitHub-owned); no third-party actions
      # so there is no unpinned-supply-chain surface to mitigate.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: pipx install uv
      - name: Enable required Postgres extensions
        run: PGPASSWORD=captureos psql -h localhost -U captureos -d captureos_test -c "CREATE EXTENSION IF NOT EXISTS vector;" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
      - name: Install dependencies
        run: uv sync --frozen || uv sync
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy captureos
      - name: Test
        run: uv run pytest -q

  web:
    name: Web (lint, type, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@10.22.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

  web-test:
    name: Web (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@10.22.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Test
        run: pnpm test

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned release binary + checksum verification, invoked directly rather than a
      # third-party Action — matches this workflow's existing GitHub-actions-only posture.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
      - name: Scan
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
